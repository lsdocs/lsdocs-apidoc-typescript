# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Advisories from the RustSec database fail the check unless listed here.
ignore = []

[licenses]
# Licenses third-party dependencies may use.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are `publish = false`; their own license is set in Cargo.toml.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Proc-macros still on syn 2 (the rest of the graph is on syn 3).
skip-tree = [
    { crate = "phf_macros@0.14", reason = "oxc; waits on oxc moving to a phf on syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
