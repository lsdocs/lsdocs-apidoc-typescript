[package]
name = "lsdocs-apidoc-typescript"
description = "First-party plugin documenting TypeScript APIs from their source code."
version.workspace = true
edition.workspace = true
# Above the workspace's: its parser needs it.
rust-version = "1.97"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lsdocs-apidoc.workspace = true
lsdocs-apidoc-plugin.workspace = true
lsdocs-plugin-sdk.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lsdocs-parser-rst.workspace = true
lsdocs-parser-markdown.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
